<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Black Hole Accretion Model</title>
<style>
  :root{
    --bg: #05070c;
    --panel: #0c0f1a;
    --panel-line: #1c2440;
    --text: #e8ecf7;
    --text-dim: #7c88ad;
    --warm: #ffd166;
    --isco: #5eead4;
    --horizon-glow: #8b5cf6;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%; background: var(--bg); color: var(--text);
    font-family: var(--sans); overflow: hidden;
  }
  #app{ display:flex; width:100vw; height:100vh; }
  #stage{ flex: 1 1 auto; position: relative; min-width:0; }
  canvas{ display:block; width:100%; height:100%; cursor: crosshair; touch-action: none; }
  #hud{
    position:absolute; top:14px; left:14px; font-family: var(--mono);
    font-size:12px; color: var(--text-dim); line-height:1.7; pointer-events:none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #hud b{ color: var(--isco); font-weight:600; }
  #hint{
    position:absolute; bottom:14px; left:14px; right:14px; font-size:12.5px;
    color: var(--text-dim); font-family: var(--sans); pointer-events:none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #panel{
    flex: 0 0 310px; background: var(--panel); border-left: 1px solid var(--panel-line);
    padding: 22px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:16px;
  }
  #panel h1{ font-size: 15px; margin: 0 0 2px 0; letter-spacing: 0.01em; font-weight: 650; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-size: 11.5px; color: var(--text-dim); display:flex; justify-content:space-between;
    font-family: var(--mono);
  }
  .field label span.val{ color: var(--warm); }
  input[type=range]{
    -webkit-appearance:none; width:100%; height:3px; border-radius:2px;
    background: var(--panel-line); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background: var(--isco); cursor:pointer; box-shadow: 0 0 8px rgba(94,234,212,0.6);
  }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; background: var(--isco); border:none;
    box-shadow: 0 0 8px rgba(94,234,212,0.6);
  }
  .row{ display:flex; gap:8px; }
  button{
    flex:1; background: transparent; border: 1px solid var(--panel-line); color: var(--text);
    padding: 9px 10px; border-radius: 6px; font-family: var(--mono); font-size:12px;
    cursor:pointer; transition: all 0.15s ease;
  }
  button:hover{ border-color: var(--isco); color: var(--isco); }
  button.primary{ border-color: var(--isco); color: var(--isco); }
  button.primary.active{ background: var(--isco); color: #04211d; font-weight:600; }
  .toggle{
    display:flex; align-items:center; justify-content:space-between; font-size:12px;
    color: var(--text-dim); font-family: var(--mono);
  }
  .toggle input{ accent-color: var(--isco); }
  hr{ border:none; border-top:1px solid var(--panel-line); margin:2px 0; }
  #stats{ font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); line-height:1.9; }
  #stats b{ color: var(--text); }
  .legend{ font-size:11px; color: var(--text-dim); line-height:1.6; }
  .legend .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  @media (max-width: 720px){
    #app{ flex-direction:column-reverse; }
    #panel{ flex: 0 0 auto; border-left:none; border-top:1px solid var(--panel-line); max-height:50vh; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="hint">Click or drag to drop matter and watch it orbit or plunge.</div>
  </div>
  <div id="panel">
    <div>
      <h1>Kerr Accretion</h1>
    </div>

    <div class="field">
      <label>Spin parameter a/M <span class="val" id="spinVal">0.600</span></label>
      <input type="range" id="spin" min="0" max="0.998" step="0.002" value="0.6">
    </div>

    <div class="field">
      <label>Relative matter velocity λ <span class="val" id="relVelVal">1.00</span></label>
      <input type="range" id="relVel" min="-1.5" max="1.5" step="0.02" value="1.0">
    </div>

    <div class="field">
      <label>Blob size <span class="val" id="sizeVal">0.45</span></label>
      <input type="range" id="blobSize" min="0.15" max="1.0" step="0.05" value="0.45">
    </div>

    <div class="field">
      <label>Blob strength <span class="val" id="strengthVal">1.0</span></label>
      <input type="range" id="blobStrength" min="0.2" max="2.5" step="0.1" value="1.0">
    </div>

    <div class="field">
      <label>Playback speed <span class="val" id="speedVal">1.0×</span></label>
      <input type="range" id="speed" min="0.2" max="4" step="0.1" value="1.0">
    </div>

    <div class="row">
      <button id="playBtn" class="primary active">Pause</button>
      <button id="clearBtn">Clear</button>
    </div>
    <div class="row">
      <button id="streamBtn">Stream from ISCO</button>
    </div>
    <div class="toggle">
      <label for="stability">Show stability (κ²)</label>
      <input type="checkbox" id="stability">
    </div>

    <hr>
    <div id="stats"></div>

    <div class="legend">
      <div><span class="dot" style="background:#5eead4"></span>ISCO</div>
      <div><span class="dot" style="background:#8b5cf6"></span>Horizon</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ================= Kerr equatorial physics (G=M=c=1) =================
  // All formulas validated against known Schwarzschild limits and metric
  // normalization g_mu_nu U^mu U^nu = -1 before being wired in here.

  function horizonRadius(a){ return 1 + Math.sqrt(Math.max(1-a*a, 0)); }

  function iscoRadius(a){ // Bardeen-Press-Teukolsky 1972, prograde
    const Z1 = 1 + Math.cbrt(1-a*a) * (Math.cbrt(1+a) + Math.cbrt(1-a));
    const Z2 = Math.sqrt(3*a*a + Z1*Z1);
    return 3 + Z2 - Math.sqrt((3-Z1) * (3+Z1+2*Z2));
  }

  function circularEL(r, a){ // energy & angular momentum of a circular equatorial geodesic
    const sr = Math.sqrt(r);
    const denom = Math.pow(r, 0.75) * Math.sqrt(Math.max(r*sr - 3*sr + 2*a, 1e-9));
    const E = (r*sr - 2*sr + a) / denom;
    const L = (r*r - 2*a*sr + a*a) / denom;
    return { E, L };
  }

  function circularOmega(r, a){ return 1 / (Math.pow(r,1.5) + a); }

  function epicyclicKappa2(r, a){
    const Om = circularOmega(r, a);
    return Om*Om * stabilityFactor(r, a);
  }

  // The sign-determining part of kappa^2, with the (small, radius-suppressing) Omega^2
  // prefactor stripped out. Same zero-crossing as kappa^2 (so r_ISCO is unchanged), but
  // O(1) instead of O(1e-4) out where we actually display it -- kappa^2 itself is too
  // tiny in the visible domain to show up in a color map.
  function stabilityFactor(r, a){
    return 1 - 6/r + 8*a/Math.pow(r,1.5) - 3*a*a/(r*r);
  }

  // Ingoing-Kerr metric at theta=pi/2 (Sigma=r^2), verified numerically against the
  // Bardeen-Press-Teukolsky geodesic formulas (norm = -1 to 1e-6 across spins/radii):
  //   g_vv = -(1-2/r), g_vr = 1, g_vphi~ = -2a/r, g_phi~phi~ = r^2+a^2+2a^2/r, g_rphi~ = -a, g_rr = 0
  // Given ANY prescribed (Ur, Uphi~) this solves the normalization condition for Uv,
  // so we're free to prescribe non-geodesic (sub/super-Keplerian, retrograde) local
  // velocities and still get a properly normalized, horizon-regular 4-velocity.
  function solveUv(r, a, Ur, Uphit){
    const gvv = -(1-2/r), gvr = 1, gvphi = -2*a/r;
    const gphiphi = r*r + a*a + 2*a*a/r, grphi = -a;
    const A = gvv;
    const B = 2*(gvr*Ur + gvphi*Uphit);
    const C = gphiphi*Uphit*Uphit + 2*grphi*Ur*Uphit + 1;
    if (Math.abs(A) < 1e-8) return -C/B; // degenerate only exactly at r=2M
    const disc = Math.max(B*B - 4*A*C, 0);
    const sq = Math.sqrt(disc);
    const cands = [(-B+sq)/(2*A), (-B-sq)/(2*A)].filter(x => x>0 && isFinite(x));
    return cands.length ? Math.min(...cands) : Math.max((-B+sq)/(2*A), (-B-sq)/(2*A));
  }

  // The pure "marginal" (zero-torque, lambda=1) plunge geodesic: conserved E,L fixed at
  // the ISCO's own circular-orbit values. Same Kerr geodesic construction as before.
  function marginalUrUphit(r, a, E, L){
    const rr = r*r, Delta = rr - 2*r + a*a;
    const X = E*(rr + a*a) - a*L, Y = L - a*E;
    const R = Math.max(X*X - Delta*(rr + Y*Y), 0);
    const sqrtR = Math.sqrt(R);
    const Ur = -sqrtR / rr;
    const stable = (rr + Y*Y) / (X + sqrtR + 1e-12);
    const Uphit = (Y + a*stable) / rr;
    return { Ur, Uphit };
  }

  // Signed "kick" at r=R_ISCO for angular momentum L=lambda*L_ISCO, energy fixed at E_ISCO:
  // positive => real inward radial velocity there (sub-Keplerian, plunges);
  // negative => no real inward solution exists there (super-Keplerian; matter can't
  // reach that radius on this energy budget, so it gets turned back outward instead).
  function computeSignedKick(lambda, a, R_ISCO, E_ISCO, L_ISCO){
    const r = R_ISCO, rr = r*r, Delta = rr - 2*r + a*a;
    const L = lambda*L_ISCO;
    const X = E_ISCO*(rr+a*a) - a*L, Y = L - a*E_ISCO;
    const Rval = X*X - Delta*(rr+Y*Y);
    const mag = Math.sqrt(Math.abs(Rval)) / rr;
    return Rval >= 0 ? mag : -mag;
  }

  // ---- Spin/lambda-dependent globals, recomputed whenever either slider moves ----
  let SPIN = 0.6, R_ISCO = 6, R_PLUS = 2, E_ISCO = 0, L_ISCO = 0;
  let LAMBDA = 1.0, KICK = 0, OUTER_EDGE = 6;

  function updateSpinDerived(a){
    SPIN = a;
    R_ISCO = iscoRadius(a);
    R_PLUS = horizonRadius(a);
    const el = circularEL(R_ISCO, a);
    E_ISCO = el.E; L_ISCO = el.L;
  }

  function updateLambdaDerived(lambda){
    LAMBDA = lambda;
    KICK = computeSignedKick(lambda, SPIN, R_ISCO, E_ISCO, L_ISCO);
    OUTER_EDGE = R_ISCO + Math.max(0, lambda - 1) * 3.0;
  }

  function velocityAt(r){
    if (r >= OUTER_EDGE){
      return { vr: 0, omega: circularOmega(Math.min(r, 60), SPIN) };
    }
    const rc = Math.max(r, R_PLUS + 0.03);
    const marg = marginalUrUphit(rc, SPIN, E_ISCO, L_ISCO);
    let Ur = marg.Ur - KICK;
    let Uphit = LAMBDA * marg.Uphit;
    if (r > R_ISCO && OUTER_EDGE > R_ISCO){
      // smoothly taper the lambda!=1 perturbation back to pure local-circular motion
      const t = (r - R_ISCO) / (OUTER_EDGE - R_ISCO);
      const smooth = 1 - t*t*(3 - 2*t);
      const circOm = circularOmega(r, SPIN);
      Ur *= smooth;
      Uphit = Uphit*smooth + circOm*(1 - smooth);
    }
    const Uv = solveUv(rc, SPIN, Ur, Uphit);
    return { vr: Ur/Uv, omega: Uphit/Uv };
  }

  // ================= Grid solver (semi-Lagrangian advection) =================
  const N = 190;
  const halfSize = 9.2;
  const dxPhys = (2*halfSize) / N;
  let fieldA = new Float32Array(N*N);
  let fieldB = new Float32Array(N*N);
  let vx = new Float32Array(N*N);
  let vy = new Float32Array(N*N);
  let sink = new Float32Array(N*N);

  function idx(i,j){ return j*N + i; }
  function gridToPhys(i,j){ return { x: -halfSize + (i+0.5)*dxPhys, y: -halfSize + (j+0.5)*dxPhys }; }

  function precomputeSink(){
    for (let j=0;j<N;j++){
      for (let i=0;i<N;i++){
        const {x,y} = gridToPhys(i,j);
        const r = Math.sqrt(x*x+y*y);
        const k = 55 / (1 + Math.exp(40*(r - (R_PLUS + 0.22))));
        sink[idx(i,j)] = k;
      }
    }
  }

  function precomputeVelocityField(){
    for (let j=0;j<N;j++){
      for (let i=0;i<N;i++){
        const {x,y} = gridToPhys(i,j);
        const r = Math.sqrt(x*x+y*y);
        const rSafe = Math.max(r, 0.02);
        const {vr, omega} = velocityAt(r);
        const id = idx(i,j);
        vx[id] = vr*(x/rSafe) - omega*y;
        vy[id] = vr*(y/rSafe) + omega*x;
      }
    }
  }

  function sampleBilinear(field, fx, fy){
    fx = Math.min(Math.max(fx, 0), N-1.001);
    fy = Math.min(Math.max(fy, 0), N-1.001);
    const i0 = Math.floor(fx), j0 = Math.floor(fy);
    const i1 = i0+1, j1 = j0+1;
    const tx = fx - i0, ty = fy - j0;
    const v00 = field[idx(i0,j0)], v10 = field[idx(i1,j0)];
    const v01 = field[idx(i0,j1)], v11 = field[idx(i1,j1)];
    const a_ = v00*(1-tx) + v10*tx;
    const b_ = v01*(1-tx) + v11*tx;
    return a_*(1-ty) + b_*ty;
  }

  function semiLagrangianStep(dT, diffCoeff){
    for (let j=0;j<N;j++){
      for (let i=0;i<N;i++){
        const id = idx(i,j);
        const {x,y} = gridToPhys(i,j);
        const xp = x - vx[id]*dT;
        const yp = y - vy[id]*dT;
        const fi = (xp + halfSize)/dxPhys - 0.5;
        const fj = (yp + halfSize)/dxPhys - 0.5;
        let val = sampleBilinear(fieldA, fi, fj);
        if (diffCoeff > 0){
          const im = i>0?i-1:0, ip = i<N-1?i+1:N-1;
          const jm = j>0?j-1:0, jp = j<N-1?j+1:N-1;
          const lap = fieldA[idx(im,j)] + fieldA[idx(ip,j)] + fieldA[idx(i,jm)] + fieldA[idx(i,jp)] - 4*fieldA[id];
          val += diffCoeff * lap / (dxPhys*dxPhys) * dT;
        }
        val *= Math.exp(-sink[id]*dT);
        fieldB[id] = Math.max(val, 0);
      }
    }
    const tmp = fieldA; fieldA = fieldB; fieldB = tmp;
  }

  function addBlob(x0, y0, sigma, strength){
    const sigma2 = sigma*sigma;
    const rad = Math.ceil((sigma*3.2)/dxPhys);
    const ci = Math.round((x0+halfSize)/dxPhys - 0.5);
    const cj = Math.round((y0+halfSize)/dxPhys - 0.5);
    for (let dj=-rad; dj<=rad; dj++){
      for (let di=-rad; di<=rad; di++){
        const i = ci+di, j = cj+dj;
        if (i<0||i>=N||j<0||j>=N) continue;
        const {x,y} = gridToPhys(i,j);
        const dd = (x-x0)*(x-x0) + (y-y0)*(y-y0);
        const val = strength * Math.exp(-dd/(2*sigma2));
        const id = idx(i,j);
        fieldA[id] = Math.min(fieldA[id] + val, 3.0);
      }
    }
  }

  // ================= Stability (epicyclic) overlay =================
  let stabilityGradientStops = [];
  function precomputeStabilityStops(){
    stabilityGradientStops = [];
    const n = 140;
    for (let k=0;k<=n;k++){
      const r = R_PLUS + (halfSize-R_PLUS) * (k/n);
      const rr = Math.max(r, R_ISCO*0.05);
      const S = stabilityFactor(Math.max(rr, 0.3), SPIN);
      const t = 0.5 + 0.5*Math.tanh(S*1.2);
      stabilityGradientStops.push({ offset: r/halfSize, t });
    }
  }
  function stabilityColor(t){
    // red (unstable) -> near-transparent white (marginal) -> cyan (stable)
    const unstable = [235,70,70], mid=[235,235,240], stable=[70,220,235];
    let a_,b_,f;
    if (t<0.5){ a_=unstable; b_=mid; f=t/0.5; } else { a_=mid; b_=stable; f=(t-0.5)/0.5; }
    return [ a_[0]+(b_[0]-a_[0])*f, a_[1]+(b_[1]-a_[1])*f, a_[2]+(b_[2]-a_[2])*f ];
  }

  // ================= Rendering =================
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas');
  off.width = N; off.height = N;
  const octx = off.getContext('2d');
  const imgData = octx.createImageData(N, N);

  let W,H,cx,cy,pxPerUnit,DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    const rect = canvas.parentElement.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx = W/2; cy = H/2;
    pxPerUnit = Math.min(W,H)*0.43 / halfSize;
  }
  window.addEventListener('resize', resize);

  function colorFor(t){
    t = Math.min(Math.max(t,0),1);
    const stops = [ [5,4,10], [90,10,20], [200,50,20], [255,140,40], [255,220,120], [255,255,255] ];
    const seg = t*(stops.length-1);
    const k = Math.min(Math.floor(seg), stops.length-2);
    const f = seg-k;
    const a_ = stops[k], b_ = stops[k+1];
    return [ a_[0]+(b_[0]-a_[0])*f, a_[1]+(b_[1]-a_[1])*f, a_[2]+(b_[2]-a_[2])*f ];
  }

  function renderField(){
    const data = imgData.data;
    for (let j=0;j<N;j++){
      for (let i=0;i<N;i++){
        const id = idx(i,j);
        const v = fieldA[id];
        const t = 1 - Math.exp(-v*1.3);
        const [r,g,b] = colorFor(t);
        const p = id*4;
        data[p]=r; data[p+1]=g; data[p+2]=b; data[p+3]=255;
      }
    }
    octx.putImageData(imgData, 0, 0);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const grad = ctx.createRadialGradient(cx,cy,0, cx,cy, Math.max(W,H)*0.7);
    grad.addColorStop(0, '#0a0e1c');
    grad.addColorStop(1, '#05070c');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle = 'rgba(124,136,173,0.08)';
    ctx.lineWidth = 1;
    for (let rr=2; rr<=halfSize; rr+=1){
      ctx.beginPath();
      ctx.arc(cx, cy, rr*pxPerUnit, 0, Math.PI*2);
      ctx.stroke();
    }

    if (document.getElementById('stability').checked){
      const maxR = halfSize*pxPerUnit;
      const g = ctx.createRadialGradient(cx,cy,0, cx,cy, maxR);
      for (const s of stabilityGradientStops){
        const [r,gg,b] = stabilityColor(s.t);
        g.addColorStop(Math.min(Math.max(s.offset,0),1), `rgba(${r|0},${gg|0},${b|0},0.32)`);
      }
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, maxR, 0, Math.PI*2);
      ctx.fill();
    }

    const size = 2*halfSize*pxPerUnit;
    ctx.imageSmoothingEnabled = true;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(off, cx-size/2, cy-size/2, size, size);
    ctx.globalCompositeOperation = 'source-over';

    ctx.strokeStyle = 'rgba(94,234,212,0.55)';
    ctx.setLineDash([6,5]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, R_ISCO*pxPerUnit, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);


    const hgrad = ctx.createRadialGradient(cx,cy, R_PLUS*pxPerUnit*0.4, cx,cy, R_PLUS*pxPerUnit*2.2);
    hgrad.addColorStop(0, 'rgba(139,92,246,0.35)');
    hgrad.addColorStop(1, 'rgba(139,92,246,0)');
    ctx.fillStyle = hgrad;
    ctx.beginPath();
    ctx.arc(cx, cy, R_PLUS*pxPerUnit*2.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(cx, cy, R_PLUS*pxPerUnit, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(139,92,246,0.8)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.font = '10.5px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(94,234,212,0.7)';
    ctx.fillText(`ISCO  r = ${R_ISCO.toFixed(2)}`, cx + R_ISCO*pxPerUnit*Math.cos(2.45)+6, cy + R_ISCO*pxPerUnit*Math.sin(2.45));
    ctx.fillStyle = 'rgba(139,92,246,0.85)';
    ctx.fillText(`horizon  r = ${R_PLUS.toFixed(2)}`, cx + R_PLUS*pxPerUnit*Math.cos(2.45)+6, cy + R_PLUS*pxPerUnit*Math.sin(2.45));
  }

  function updateHUD(){
    document.getElementById('hud').innerHTML =
      `a = <b>${SPIN.toFixed(3)}</b>   λ = <b>${LAMBDA.toFixed(2)}</b>   T = <b>${T.toFixed(1)}</b> <span style="opacity:0.6">[GM/c\u00b3]</span>`;
    let total = 0, maxV = 0;
    for (let k=0;k<fieldA.length;k++){ total += fieldA[k]; if (fieldA[k]>maxV) maxV = fieldA[k]; }
    document.getElementById('stats').innerHTML = `
      <div>r<sub>ISCO</sub> = <b>${R_ISCO.toFixed(3)} M</b> &nbsp; r<sub>+</sub> = <b>${R_PLUS.toFixed(3)} M</b></div>
      <div>Total matter on grid: <b>${(total*dxPhys*dxPhys).toFixed(2)}</b></div>
      <div>Peak density: <b>${maxV.toFixed(2)}</b></div>
    `;
  }

  // ================= Interaction =================
  let T = 0, playing = true, streaming = false, streamPhi = 0, streamAcc = 0;
  const STREAM_DT = 4;
  let painting = false;

  function physFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const sx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const sy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: (sx-cx)/pxPerUnit, y: (sy-cy)/pxPerUnit };
  }

  function tryPaint(e){
    const {x,y} = physFromEvent(e);
    const r = Math.sqrt(x*x+y*y);
    if (r < R_PLUS + 0.05 || r > halfSize - 0.3) return;
    const sigma = parseFloat(document.getElementById('blobSize').value);
    const strength = parseFloat(document.getElementById('blobStrength').value);
    addBlob(x, y, sigma, strength*0.35);
  }

  canvas.addEventListener('mousedown', (e)=>{ painting = true; tryPaint(e); });
  canvas.addEventListener('mousemove', (e)=>{ if (painting) tryPaint(e); });
  window.addEventListener('mouseup', ()=> painting = false);
  canvas.addEventListener('touchstart', (e)=>{ painting = true; tryPaint(e); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchmove', (e)=>{ if (painting) tryPaint(e); e.preventDefault(); }, {passive:false});
  window.addEventListener('touchend', ()=> painting = false);

  const spinSlider = document.getElementById('spin');
  const spinVal = document.getElementById('spinVal');
  const relVelSlider = document.getElementById('relVel');
  const relVelVal = document.getElementById('relVelVal');

  function onSpinChange(){
    const a = parseFloat(spinSlider.value);
    spinVal.textContent = a.toFixed(3);
    updateSpinDerived(a);
    updateLambdaDerived(parseFloat(relVelSlider.value)); // R_ISCO/E_ISCO/L_ISCO changed too
    precomputeVelocityField();
    precomputeSink();
    precomputeStabilityStops();
  }
  spinSlider.addEventListener('input', onSpinChange);

  function onRelVelChange(){
    const lambda = parseFloat(relVelSlider.value);
    relVelVal.textContent = lambda.toFixed(2);
    updateLambdaDerived(lambda);
    precomputeVelocityField();
  }
  relVelSlider.addEventListener('input', onRelVelChange);

  document.getElementById('blobSize').addEventListener('input', function(){
    document.getElementById('sizeVal').textContent = parseFloat(this.value).toFixed(2);
  });
  document.getElementById('blobStrength').addEventListener('input', function(){
    document.getElementById('strengthVal').textContent = parseFloat(this.value).toFixed(1);
  });
  document.getElementById('speed').addEventListener('input', function(){
    document.getElementById('speedVal').textContent = parseFloat(this.value).toFixed(1)+'\u00d7';
  });

  const playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', ()=>{
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
    playBtn.classList.toggle('active', playing);
  });
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    fieldA.fill(0); fieldB.fill(0); T = 0; streaming = false;
    document.getElementById('streamBtn').classList.remove('active');
    document.getElementById('streamBtn').textContent = 'Stream from ISCO';
  });
  const streamBtn = document.getElementById('streamBtn');
  streamBtn.addEventListener('click', ()=>{
    streaming = !streaming;
    streamBtn.classList.toggle('active', streaming);
    streamBtn.textContent = streaming ? 'Stop stream' : 'Stream from ISCO';
    streamAcc = 0;
  });

  // ================= Main loop =================
  let lastTime = performance.now();
  function frame(now){
    const wallDT = Math.min((now-lastTime)/1000, 0.05);
    lastTime = now;

    if (playing){
      const speed = parseFloat(document.getElementById('speed').value);
      // Fixed small value: explicit-scheme diffusion is only stable while
      // diffCoeff * subDT / dx^2 stays well under ~0.25 (CFL-type limit).
      // With dx ~ 0.097 and subDT capped below, 0.0006 sits comfortably inside that.
      const diffCoeff = 0.0006;
      const simDT = wallDT * 22 * speed;
      const nSub = Math.min(Math.max(Math.ceil(simDT/0.4), 1), 8);
      const subDT = simDT / nSub;
      for (let s=0; s<nSub; s++){
        semiLagrangianStep(subDT, diffCoeff);
        T += subDT;
      }

      if (streaming){
        streamAcc += simDT;
        const OmegaI = circularOmega(R_ISCO, SPIN);
        streamPhi -= OmegaI * simDT;
        while (streamAcc >= STREAM_DT){
          const x0 = R_ISCO*Math.cos(streamPhi), y0 = R_ISCO*Math.sin(streamPhi);
          const sigma = parseFloat(document.getElementById('blobSize').value)*0.7;
          const strength = parseFloat(document.getElementById('blobStrength').value)*0.3;
          addBlob(x0, y0, sigma, strength);
          streamAcc -= STREAM_DT;
        }
      }
    }

    renderField();
    draw();
    updateHUD();
    requestAnimationFrame(frame);
  }

  updateSpinDerived(parseFloat(spinSlider.value));
  updateLambdaDerived(parseFloat(relVelSlider.value));
  precomputeVelocityField();
  precomputeSink();
  precomputeStabilityStops();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
